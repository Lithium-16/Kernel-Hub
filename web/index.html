<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cold War RTS (working title)</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #12161c; }
      /* Viewport units (not %) so the canvas can't collapse from a parent with no height. */
      canvas#glcanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!-- macroquad / miniquad JS bootstrap -->
    <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
    <script>
      // Cache-bust so a rebuilt .wasm is always fetched fresh.
      load("coldwar-rts.wasm?v=" + Date.now());
    </script>
  </body>
</html>
