[package]
name = "kernel-desktop"
version = "0.1.0"
description = "Kernel desktop app"
edition = "2024"
publish = false

# Its own workspace: the desktop app needs WebView system libraries that the node
# crates (and their CI job) don't.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
# Keep on the same minor version as @tauri-apps/plugin-notification (tauri build checks).
tauri-plugin-notification = "~2.4"
tauri-plugin-single-instance = "2"
# Self-update: GitHub releases over HTTPS, checked with SHA-256.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
