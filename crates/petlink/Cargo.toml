[package]
name = "petlink"
description = "PetLink: linked desktop pets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "petlink"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
futures = { workspace = true }
reqwest = { workspace = true, features = ["stream", "query"] }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
ulid = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
image = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Not the workspace lints: Win32 calls need unsafe, confined to src/win.rs.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target."cfg(windows)".dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.35.0"
rfd = "0.17.2"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_Security"] }
xcap = "0.9.8"
