# Example kerneld config. Copy to a private location and change the token.
node_id = "pluto"
node_name = "Pluto"
listen = "0.0.0.0:47800"          # the node still only accepts Tailscale and localhost
allow_lan = false                 # true also allows the home network
token = "change-me-to-a-long-random-string"
modules_dir = "D:/Kernel/modules"
data_dir = "C:/Users/you/AppData/Local/Kernel/node"
python = "C:/Users/you/AppData/Local/Kernel/node/runtimes/python312/python.exe"

# Only start these modules (leave empty to start every module found).
enabled_modules = []

# Self-update from GitHub Releases (node-build-N). install-node.ps1 fills this in.
[update]
repo = "B0RE16/laughing-waffle"
token = ""                  # read-only token; the repo is private
check_interval_h = 6
auto_install = false
scheduled_task = "Kernel node"

[supervisor]
ping_interval_ms = 10000
ping_misses = 3
status_interval_ms = 2000
max_crashes = 5
crash_window_s = 300

# Alerts for events (crashes, disconnects, new builds) through a Discord channel webhook:
# channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL.
[notify]
discord_webhook = ""
min_level = "warn"          # info, warn or error
include = []                # also send these, e.g. ["player.joined", "minecraft.*"]
mute = []                   # never send these

# Actions on a timer, in this PC's local time. Runs missed while the PC was off are skipped.
# at: "daily 04:00", "sun 03:30", "mon,wed,fri 18:00", "weekdays 07:00", "every 30m", "every 6h".
# Actions that need approval run only with approved = true; button-only actions never do.
#
# [[schedule]]
# name = "Nightly backup"
# at = "daily 04:00"
# module = "minecraft"
# action = "world.backup"
#
# [[schedule]]
# name = "Weekly restart"
# at = "mon 05:00"
# module = "minecraft"
# action = "server.stop"
# params = { delay_min = 5 }
# approved = true

# Automations with triggers. Same permission rules as schedules (approved = true for
# actions that normally ask first).
#
# When an event happens (a kind, or module.kind; a trailing * matches anything after it):
# [[on_event]]
# name = "Free VRAM after a batch"
# event = "comfyui.queue.finished"
# module = "vram"
# action = "vram.free_idle"
# cooldown_min = 1
#
# When a module's status meets a condition for a while (==, !=, <, <=, >, >=):
# [[when]]
# name = "Stop an empty server"
# status = "minecraft"
# condition = "players_online == 0"
# for_min = 30
# module = "minecraft"
# action = "server.stop"
# approved = true

# The assistant: Ollama on this PC answers first, Claude is the optional fallback.
[assistant]
enabled = true
# Through the VRAM module's turn-taking proxy first, then Ollama directly.
ollama_urls = ["http://127.0.0.1:11435", "http://127.0.0.1:11434"]
model = "qwen3:8b"
anthropic_api_key = ""          # optional: console.anthropic.com > API keys
claude_model = "claude-haiku-4-5"
monthly_budget_usd = 3.0
persona = true                  # tsundere catgirl; false for plain
