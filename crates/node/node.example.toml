# Example kerneld config. Copy to a private location and change the token.
node_id = "pluto"
node_name = "Pluto"
listen = "0.0.0.0:47800"          # the node still only accepts Tailscale and localhost
allow_lan = false                 # true also allows the home network
token = "change-me-to-a-long-random-string"
modules_dir = "D:/Kernel/modules"
data_dir = "C:/Users/you/AppData/Local/Kernel/node"
python = "C:/Users/you/AppData/Local/Kernel/node/runtimes/python312/python.exe"

# Only start these modules (leave empty to start every module found).
enabled_modules = []

# Self-update from GitHub Releases (node-build-N). install-node.ps1 fills this in.
[update]
repo = "B0RE16/laughing-waffle"
token = ""                  # read-only token; the repo is private
check_interval_h = 6
auto_install = false
scheduled_task = "Kernel node"

[supervisor]
ping_interval_ms = 10000
ping_misses = 3
status_interval_ms = 2000
max_crashes = 5
crash_window_s = 300
