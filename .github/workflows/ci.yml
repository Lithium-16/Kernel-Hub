name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - name: Python env for module tests
        run: |
          uv venv .venv
          uv pip install --python .venv -e "sdk/python[dev]"
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "KERNEL_TEST_PYTHON=$("$PY" -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated schema is up to date
        run: |
          pnpm gen:schema
          git diff --exit-code packages/protocol/schema

  desktop:
    name: Desktop app (windows-latest)
    runs-on: windows-latest
    env:
      # Baked into the app; it compares it with releases to find updates for itself.
      KERNEL_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # The Rust side embeds the built frontend, so build it before clippy.
      - run: pnpm --filter @kernel/desktop build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build the installer
        run: pnpm --filter @kernel/desktop tauri build
      - name: Name the installer and hash it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-out
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe desktop-out/kernel-desktop-setup.exe
          cd desktop-out && sha256sum kernel-desktop-setup.exe > kernel-desktop-setup.exe.sha256
          cat kernel-desktop-setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-desktop-windows
          path: |
            desktop-out/kernel-desktop-setup.exe
            desktop-out/kernel-desktop-setup.exe.sha256
          if-no-files-found: error

  node-bundle:
    name: Node bundle (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Baked into kerneld; installed nodes compare it to decide whether a release is newer.
      KERNEL_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: astral-sh/setup-uv@v6
      - run: cargo build --release -p kernel-node
      - name: Package kernel-node-windows-x64.zip
        run: |
          set -euo pipefail
          rm -rf bundle && mkdir -p bundle/sdk
          cp target/release/kerneld.exe scripts/install-node.ps1 bundle/
          cp -r modules bundle/modules
          rm -rf bundle/modules/*/tests bundle/modules/*/settings.local.toml
          find bundle/modules -name __pycache__ -type d -prune -exec rm -rf {} +
          uv build --wheel --out-dir bundle/sdk sdk/python
          echo "$KERNEL_BUILD" > bundle/BUILD
          # Python's zipfile writes / separators (PowerShell 5's Compress-Archive doesn't).
          uv run --no-project python -c "import shutil; shutil.make_archive('kernel-node-windows-x64', 'zip', 'bundle')"
          sha256sum kernel-node-windows-x64.zip > kernel-node-windows-x64.zip.sha256
          cat kernel-node-windows-x64.zip.sha256
          uv run --no-project python -c "import zipfile; n = zipfile.ZipFile('kernel-node-windows-x64.zip').namelist(); assert 'kerneld.exe' in n and 'BUILD' in n, n[:5]; print(len(n), 'files')"
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-node-windows
          path: |
            kernel-node-windows-x64.zip
            kernel-node-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish node build
    # Every green push to main becomes a release that installed nodes can update to.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, typescript, python, node-bundle, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kernel-node-windows
      - uses: actions/download-artifact@v4
        with:
          name: kernel-desktop-windows
      - name: Create release node-build-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "node-build-${{ github.run_number }}" \
            kernel-node-windows-x64.zip kernel-node-windows-x64.zip.sha256 \
            kernel-desktop-setup.exe kernel-desktop-setup.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Node build ${{ github.run_number }}" \
            --notes "Kernel from $GITHUB_SHA. Installed nodes find it with Node > Check for updates, the desktop app with Settings > App updates."

  python:
    name: Python SDK and modules (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .venv
      - name: Install the SDK and every module's requirements
        run: uv pip install --python .venv -e "sdk/python[dev]" $(for r in modules/*/requirements.txt; do printf -- '-r %s ' "$r"; done)
      - run: uv run --python .venv --no-project pytest
