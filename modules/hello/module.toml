id = "hello"
name = "Hello"
icon = "hand"
version = "0.1.0"
runtime = "python"
entry = "main.py"

[[actions]]
id = "greet.say"
label = "Say hello"
icon = "message-square"
description = "Returns a greeting and counts it."
ai = "safe"
params.name = { type = "string", description = "Who to greet", default = "world" }

[[actions]]
id = "counter.reset"
label = "Reset counter"
icon = "rotate-ccw"
description = "Resets the greeting counter to zero."
ai = "confirm"

[[actions]]
id = "slow.wait"
label = "Wait"
description = "Sleeps, for testing timeouts."
ai = "safe"
timeout_s = 1
params.seconds = { type = "float", min = 0, max = 30 }

[[actions]]
id = "greet.count"
label = "Count greetings"
description = "Reads the counter. Quiet: polled reads stay out of the activity log."
ai = "safe"
quiet = true

[[actions]]
id = "debug.crash"
label = "Crash the module"
description = "Exits the process, for testing supervision."
ai = "never"

[[actions]]
id = "event.emit"
label = "Report an event"
description = "Reports an event to the node, for testing events and alerts."
ai = "safe"
params.message = { type = "string", default = "Something happened" }
params.level = { type = "enum", options = ["info", "warn", "error"], default = "info" }
