id = "laya"
name = "LAYA"
icon = "route"
version = "0.1.0"
runtime = "python"
entry = "main.py"

# LAYA (https://pypi.org/project/laya/, Apache-2.0): a small decision model the assistant asks
# first. In a fraction of a second it guesses which buttons a message is about, so the chat
# model gets a short tool list, and a plain "is the server up?" runs straight away.
# The assistant works without it; it just skips this step.
# Installs the laya package by itself (or with the Install button) and downloads the ~1.7 GB
# model on first load.
[settings]
# "cpu" keeps the GPU free for LLMs and images. "cuda" is faster but takes ~1 GB of VRAM
# (and needs the CUDA build of PyTorch).
device = "cpu"
# "english", or "multilingual" if you chat in other languages.
model = "english"
# Load the model when the module starts, so the first message doesn't wait for it.
preload = true
# Install the laya package (and PyTorch, a few hundred MB) by itself when it's missing.
auto_install = true
# For Hugging Face, only if downloads are refused.
hf_token = ""

[[actions]]
id = "tools.rank"
label = "Pick tools"
icon = "route"
description = "Ranks the assistant's tools for a message. The node's assistant calls this."
ai = "safe"
quiet = true
timeout_s = 30
params.text = { type = "string", description = "The person's message" }
params.context = { type = "string", description = "The message before it", default = "" }
params.options = { type = "string", description = "JSON object: tool name -> what it does" }
params.keep = { type = "int", description = "How many tools to keep", default = 16, min = 1, max = 200 }
params.pick = { type = "int", description = "How many of those LAYA chooses between", default = 10, min = 2, max = 40 }

[[actions]]
id = "model.load"
label = "Load model"
icon = "download"
description = "Loads the model now (downloads it the first time, ~1.7 GB)."
ai = "safe"

[[actions]]
id = "model.unload"
label = "Unload model"
icon = "power"
description = "Frees the ~2 GB of RAM the model takes. The assistant works without it, just without the shortcut."
ai = "safe"

[[actions]]
id = "setup.install"
label = "Install LAYA"
icon = "package-plus"
description = "Installs the laya package and PyTorch into Kernel's Python environment (a few hundred MB)."
ai = "never"
timeout_s = 1800
